# HTTPS vhost 
#
# The app config sets base_url = https://127.0.0.1:4443/ and
# cookie_secure = TRUE, so the site MUST be served over HTTPS or the
# session cookie is dropped and logins silently fail. Apache listens on
# 443 inside the container; docker-compose maps host 4443 -> container 443.

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/server.key

    # /var/www/html IS the app's public_html (COPY'd in the Dockerfile,
    # bind-mounted over by docker-compose for live editing).
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>


    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
