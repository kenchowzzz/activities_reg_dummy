
date.timezone = Asia/Hong_Kong


output_buffering = 4096

; Dev: surface real errors, but hide CI3's PHP-7.4 deprecation/notice noise.
display_errors         = On
display_startup_errors = On
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_NOTICE
log_errors             = On

memory_limit        = 256M
max_execution_time  = 120

; Image default is only 2M; registration attachments / visitor-list CSV
; uploads need more headroom.
upload_max_filesize = 25M
post_max_size       = 30M
